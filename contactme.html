<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Me</title>

  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="style.css">

  <!-- Link to the external JavaScript file -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Header with navigation bar -->
  <header class="main-header">
    <nav>
      <ul>
        <!-- Navigation links to the three pages -->
        <li><a href="index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contactme.html">Contact Me</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content of the page -->
  <main>

    <!-- Contact form section -->
    <section id="contact-me">
      <h2>Contact Me</h2>

      <!-- Form starts here -->
      <form id="contactForm" onsubmit="return validateform()"> 

        <!-- First name input -->
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstname">

        <br><br>

        <!-- Description input -->
        <label for="description">Project Description:</label>
        <input type="text" id="description" name="description">

        <br><br>
        
        <!-- Email input -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <!-- Confirm email input -->
        <label for="confirmemail">Confirm Email:</label>
        <input type="email" id="confirmemail" name="confirmemail">

        <br><br>

        <!-- Phone number input -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">

        <br><br>

        <!-- Preferred contact method -->
        <p>Preferred Contact Method:</p>

        <label>
          <input type="radio" name="contactmethod" value="email"> Email
        </label>

        <label>
          <input type="radio" name="contactmethod" value="phone"> Phone
        </label>

        <br><br>

        <!-- Project date input -->
        <label for="date">Project Date:</label>
        <input type="date" id="projectdate" name="date">

        <br><br>

        <!-- Project duration input -->
        <label for="duration">Project Duration (days):</label>
        <input type="number" id="duration" name="duration">

        <br><br>

        <!-- Submit button -->
        <input type="submit" id="submit" value="Submit">

      </form>

    </section>

  </main>

  <!-- Footer at the bottom of the page -->
  <footer>
    <p>&copy; 2026 Adonis Mohamad</p>
  </footer>


  
</body>
</html>
